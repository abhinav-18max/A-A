name: Adapter tests
on: [push, pull_request, workflow_dispatch]
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.16'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - run: uv sync --locked --extra dev --python 3.12
      - run: npm ci --prefix browser-worker
      - run: uv run python tools/generate.py --typescript --rust
      - run: uv run python tools/browser_build.py
      - run: git diff --exit-code -- src/mba/generated browser-worker/src/generated media-core/src/generated.rs src/mba/worker
      - run: uv run ruff check src tests tools deploy examples
      - run: uv run pytest -m 'not linux and not soak and not browser' -q
      - run: uv build --wheel
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.16'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked --extra dev --extra native --extra mcp --python 3.12
      - run: npm ci --prefix browser-worker
      - run: npm ci --prefix harness-client
      - run: uv run python tools/browser_build.py
      - run: npm run test:types --prefix harness-client
      - run: npx --prefix browser-worker playwright install --with-deps chromium
      - run: MBA_BROWSER_TESTS=1 uv run pytest tests/test_browser.py tests/test_library.py tests/test_harness_interfaces.py tests/test_webmcp.py -q
  media:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - run: sudo apt-get update && sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - run: cargo test --locked --manifest-path media-core/Cargo.toml
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.16'
      - run: uv sync --locked --extra dev --python 3.12
      - run: cargo build --locked --manifest-path media-core/Cargo.toml
      - run: MBA_NATIVE_TEST_BINARY="$PWD/media-core/target/debug/mba-media" uv run pytest tests/test_native_rpc.py -q
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.16'
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run python deploy/build.py
      - run: uv run python deploy/test-container.py --image mba-worker:0.3.0
      - run: uv run python deploy/test-http-container.py --image mba-worker:0.3.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evidence
          include-hidden-files: true
          path: |
            .cache/container-artifacts
            .cache/http-container-artifacts
  native:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, mba-devices]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.16'
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run python deploy/build.py
      - run: uv run mba preflight
      - run: MBA_LINUX_TESTS=1 uv run pytest tests/test_linux.py -q
